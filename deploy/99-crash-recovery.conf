# The Pi froze on 2026-07-05 and had to be manually power-cycled. By default the kernel HALTS on a
# fault (kernel.panic=0) and never reboots — so any panic/hang stays dead. Make faults reboot, and
# turn hangs/stalls (like the SDIO deadlock) into a reboot so the box self-recovers and the reason
# is captured in the (persistent) journal instead of being lost.
kernel.panic = 15
kernel.panic_on_oops = 1
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 90
kernel.panic_on_rcu_stall = 1
